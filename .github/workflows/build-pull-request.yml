name: Build Pull Request
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Pull Request [ubuntu-latest--x64]
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'spring-io/spring-javaformat' }}
    steps:
    - name: Check Out
      uses: actions/checkout@v4
    - name: Set Up
      uses: ./.github/actions/setup
    - name: Build
      run: ./mvnw clean install --batch-mode --no-transfer-progress 
        --update-snapshots
    timeout-minutes: 150
